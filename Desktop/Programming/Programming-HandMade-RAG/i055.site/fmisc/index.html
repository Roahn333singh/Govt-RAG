<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            AI Chat Bot Flood Management Information System Centre Assistance
        </title>
        <meta name="color-scheme" content="light only" />
        <style>
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                padding: 0;
                display: grid;
                place-items: center;
                background: #fff7ef;
                color: #1f1f1f;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans",
                    "Helvetica Neue", Arial, sans-serif;
            }
            .demo {
                text-align: center;
            }
            .brand {
                font-weight: 800;
                font-size: 2rem;
                color: #00446d;
                margin-bottom: 8px;
            }
            .hint {
                color: #6b6b6b;
                font-weight: 300;
                font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <div class="demo">
            <div class="brand">
                Always Online. Your FMISC Virtual Assistant,Available 24/7 (AI
                Chat Bot)
            </div>
            <div class="hint">Flood Management Information System Centre</div>
        </div>
        <script src="./widget.js"></script>
        <script>
            // Deployment-safe webhook resolver:
            // 1) ?api=https://.../chat
            // 2) previously saved value in localStorage
            // 3) local default for local dev
            const params = new URLSearchParams(window.location.search);
            const apiFromQuery = params.get("api");
            const storageKey = "cw-webhook-url";
            if (params.get("clearApi") === "1") {
                localStorage.removeItem(storageKey);
            }
            if (apiFromQuery) {
                localStorage.setItem(storageKey, apiFromQuery);
            }
            const webhookUrl =
                apiFromQuery ||
                localStorage.getItem(storageKey) ||
                "https://3c35-2409-40e3-5003-a774-3dcb-6b05-5f0e-89f9.ngrok-free.app/chat";

            ChatWidget.init({
                webhookUrl,
                themeColor: "#00446D",
                title: "AI Chat Bot Assistant",
                greeting:
                    "Hi there! 👋 My name is Nathan. How can I assist you today?",
                position: "bottom-right",
            });
        </script>
    </body>
</html>
