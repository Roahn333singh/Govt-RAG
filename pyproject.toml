[project]
name = "programming-handmade-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.15",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.1.7",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
    "qdrant-client[fastembed]>=1.13.0",
    "fastembed>=0.4.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.136.0",
    "langdetect>=1.0.9",
    "uvicorn>=0.44.0",
    "pydantic>=2.13.2",
    "slowapi>=0.1.9",
    "langchain-qdrant>=0.1.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "openai>=3.37.0",
    "langchain-openai>=1.7.2",
    "redis>=8.1.0",
    "cachetools>=7.2.6",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-propagator-gcp>=1.15.0",
    "opentelemetry-resourcedetector-gcp>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
